name: ci

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # The plugin's own suite. The wire-vocabulary contract test reads the engine's docs, so the
  # engine is checked out beside this repository and named with AFZ_DOCS.
  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: DustinEwan/autofuzz
          path: .engine

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        run: AFZ_DOCS=$GITHUB_WORKSPACE/.engine/docs npm ci

      - name: Tests
        run: AFZ_DOCS=$GITHUB_WORKSPACE/.engine/docs npm test

  # The conformance gate, run through the product command rather than a bespoke harness:
  # `afz install-harness` builds this repository, drives the suite, and prints the report.
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install afz
        run: cargo install --git https://github.com/DustinEwan/autofuzz.git afz-cli --locked

      - name: Validate
        run: afz install-harness "$GITHUB_WORKSPACE" --json > report.json

      # The plugin built in this checkout, with the manifest's own install and build commands:
      # `npm run build` is `tsc`, which needs the installed typescript. The runner spawns
      # `node dist/server.js` for the wire rules before it starts the suite, so `dist` has to
      # exist by then, and `afz install-harness` above builds its own clone of this repository
      # rather than this working tree.
      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      # The mechanism's own conformance check: prpc-core spawns this plugin and runs the six wire
      # rules (spawn, protocol-version, handshake-schema, unknown-method, framing-intact,
      # process-alive), then runs the profile's suite program - `afz validate-harness` - and
      # prints the profile's rules after the wire rules. The profile spec and the schemas it names
      # come from a shallow clone of the engine rather than a copy in this repository, because a
      # copy would drift from the engine this plugin is validated against. The runner runs from
      # this workspace because the suite program resolves the manifest's relative paths, and the
      # emitter, beside the directory it was started in. It exits non-zero on any violation or
      # suite error, so a broken wire contract fails this job.
      - name: Wire conformance
        run: |
          cargo install plugin-rpc --bin prpc-core --version 0.1.0-alpha.8 --locked
          git clone --depth 1 https://github.com/DustinEwan/autofuzz.git "$RUNNER_TEMP/afz-engine"
          prpc-core "$RUNNER_TEMP/afz-engine/afz-1.profile.json" ./afz-harness.json --suite

      # The goldens this repository publishes: zero violations, eleven of twelve template passes, and
      # `private-symbol` as the single justified absence - on the protocol side and the
      # fixture side. A deleted or gutted validator fails the second assertion.
      - name: Assert the report
        run: |
          jq -e '((.violations | length) == 0)
                 and ((.template.properties | map(select(.verdict == "not-applicable") | .id)) == ["private-symbol"])
                 and ((.template.properties | map(select(.verdict == "pass")) | length) == 11)' report.json
          jq -e '((.validator.properties | map(select(.verdict == "pass")) | length) == 6)
                 and ((.validator.properties | map(select(.verdict == "not-applicable") | .id) | sort) == ["private-symbol"])' report.json
